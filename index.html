<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu and Login Dropdown</title>
    <style>
        /* General styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
        }

        /* Header Styling */
        header {
            background-color: #4CAF50;
            height: 70px;
            width: 100%;
            position: fixed;
            justify-content: space-between;
            display: flex;
            align-items: center;
            z-index: 1000;
        }
        header img {
            margin-left: 20px;
        }
        header nav {
            display: flex;
            margin-right: 20px;
            gap: 20px;
        }
        header nav a, header nav p {
            color: white;
            text-decoration: none;
            cursor: pointer;
            align-items: center;
            margin: 0;
        }

        /* Dropdown styling */
        .dropdown {
            position: relative;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            right: 0;
            top: 40px;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 16px;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
        .dropdown.active .dropdown-content {
            display: block;
        }

        /* Mobile Menu Icon */
        .menu-icon {
            display: none;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            margin-right: 20px;
        }
        .menu-icon div {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 4px 0;
        }

        /* Background Image and Quote Section */
        .div {
            background-image: url('bank.jpg'); /* Add your image path here */
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            text-align: center;
            color: white;
            padding: 20px;
        }
        h1 {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            font-size: 3em;
        }

        /* Button styling */
        .button-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            color: white;
            background-color: #4CAF50;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }

        /* Footer styling */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
            width: 100%;
            position: fixed;
            bottom: 0;
        }

        /* Media queries for mobile responsiveness */
        @media (max-width: 768px) {
            header nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                background-color: #4CAF50;
                width: 100%;
                text-align: center;
                padding: 10px 0;
            }
            header nav.active {
                display: flex;
            }
            .menu-icon {
                display: flex;
            }

            /* Adjusting quote and buttons for mobile */
            h1 {
                font-size: 2em;
            }
            .button-container {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html"><img src="uploads/LOGO.png" height="50px"></a>

        <div class="menu-icon" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <nav id="navbar">
            <a href="index.html">Home</a>
            <a href="ContactUs.html">Contact Us</a>
            <a href="aboutus.html">About</a>
            <div class="dropdown" id="loginDropdown">
                <p onclick="toggleDropdown()">Login</p>
                <div class="dropdown-content" id="dropdownContent">
                    <a href="attender_login.html">Attender's Login</a>
                    <a href="login.html">Blood Bank Login</a>
                    <a href="add.html">Add Blood Bank</a>
                </div>
            </div>
        </nav>
    </header>

    <div class="div">
        <h1>YOUR DONATION TODAY CAN GIVE SOMEONE ELSE A TOMORROW.<br>DONATE BLOOD, SAVE LIVES!</h1>
        <div class="button-container">
            <button id="btn1" onclick="window.location.href='http://localhost:3000'">NEED🩸</button>
            <button id="btn2" onclick="window.location.href='add.html'">ADD BANK</button>
        </div>
    </div>

    <footer class="footer">
        <p>© 2024 UTHIRAM. All Rights Reserved</p>
    </footer>

    <script>
        // Toggle mobile menu visibility
        function toggleMenu() {
            var navbar = document.getElementById("navbar");
            navbar.classList.toggle("active");
        }

        // Toggle dropdown visibility
        function toggleDropdown() {
            var dropdown = document.getElementById("loginDropdown");
        
            dropdown.classList.toggle("active");
        }
    </script>
</body>
</html>
